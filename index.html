esc(m.name)}" aria-pressed="${!!movieState[m.name]?.favorite}">${movieState[m.name]?.favorite?'♥':'♡'}</button><button data-movie="${movies.indexOf(m)}" title="查看详情" aria-label="查看${esc(m.name)}详情">•••</button></div></div><h4>${esc(m.name)}</h4><p>${m.year} · ${m.kind}</p></article>`).join('')}</div>`:`<div class="empty"><span class="empty-icon">🎬</span>${saved?'暂无符合条件的收藏。请先在影片卡片上点击「收藏」。':'暂无符合条件的影片，可调整筛选条件。'}</div>`)+`<p class="notice">影片为示意数据；收藏与已看状态保存在此浏览器中。视频暂未接入播放服务。</p>`;
  }
  function musicPage(){return header(section,'给日常加一点好听的背景音乐。',btn('＋ 添加本地音乐','music-upload',true))+`<div class="album-grid">${[['漫游','随心听的每一天','photo-1470225620780-dba8ba36b745'],['收藏','你喜欢的声音','photo-1516280440614-37939bbacd81'],['最近播放','继续上次的旋律','photo-1459749411175-04bf5292ceea'],['我的歌单','把心情装进歌单','photo-1511379938547-c1f69419868d']].map(([name,sub,id],i)=>`<div class="album" data-album="${i}" role="button" tabindex="0" aria-label="查看${name}"><img src="${image(id)}" alt="" loading="lazy"><span class="album-icon">${['♫','♡','◷','＋'][i]}</span><div class="album-copy"><strong>${name}</strong><small>${sub}</small></div></div>`).join('')}</div>`+title('音乐列表',audioUrls.length?`${audioUrls.length} 首本地歌曲`:'演示歌曲 · 添加本地音频后可播放')+`<div class="song-list">${songs.map((s,i)=>`<div class="song-row"><span class="number">${String(i+1).padStart(2,'0')}</span><span class="song-name">${esc(s.name)}<small>${esc(s.artist)}</small></span><span class="artist-col">${esc(s.artist)}</span><span class="duration">${s.duration}</span><button data-song="${i}" aria-label="${audioUrls[i]?'播放':'查看'}${esc(s.name)}">▷</button></div>`).join('')}</div><p class="notice">演示曲目不含音频。添加本地音乐后，可在当前浏览器会话中播放（不会上传到服务器）。</p>`;}
  function galleryPage(){
    let list=photoFilter==='收藏照片'?[]:photoFilter==='最近添加'?photos.filter(p=>p.local):photos;
    list=list.filter(p=>(photoType==='全部'||p.type===photoType)&&(photoTime==='全部'||p.date.startsWith(photoTime))&&(!query||p.name.includes(query)));
    return header(photoFilter,'让照片不只是照片，更是家人共同的记忆。',btn('＋ 上传照片','photo-upload',true))+`<div class="photo-toolbar"><input id="photo-search" class="search" type="search" placeholder="搜索照片名称" value="${esc(query)}" aria-label="搜索照片"><span class="filter-label">内容</span><select class="select" id="photo-type" aria-label="按照片内容筛选">${['全部','人物','景色'].map(v=>`<option ${photoType===v?'selected':''}>${v}</option>`).join('')}</select><span class="filter-label">时间</span><select class="select" id="photo-time" aria-label="按年份筛选">${['全部','2026','2025','2024'].map(v=>`<option value="${v}" ${photoTime===v?'selected':''}>${v==='全部'?v:v+'年'}</option>`).join('')}</select><span class="tag photo-count">${list.length} 张照片</span><div class="layout-buttons" role="group" aria-label="照片排列方式">${[['网格','▦'],['紧凑','▥'],['列表','☰']].map(([v,icon])=>`<button class="${photoLayout===v?'active':''}" data-photo-layout="${v}" aria-label="${v}排列" title="${v}排列" aria-pressed="${photoLayout===v}">${icon} ${v}</button>`).join('')}</div></div>`+title(photoFilter==='照片图库'?'时光图库':photoFilter,'按家庭时光整理')+(list.length?`<div class="photo-grid ${photoLayout==='紧凑'?'compact':photoLayout==='列表'?'list':''}">${list.map(p=>`<button class="photo-card ${p.wide?'wide':''}" data-photo="${photos.indexOf(p)}" aria-label="查看${esc(p.name)}"><img src="${safeSrc(p.src)}" alt="${esc(p.name)}" loading="lazy"><span>${esc(p.name)} · ${esc(p.date)}</span></button>`).join('')}</div>`:`<div class="empty"><span class="empty-icon">▧</span>${photoFilter==='收藏照片'?'暂无收藏照片。':photoFilter==='最近添加'?'暂无符合条件的最近上传照片。':'没有符合条件的照片，请更换筛选条件。'}</div>`)+`<p class="notice">示意照片仅使用人工标注的分类与日期；新上传照片默认分类为「人物」，日期为上传当天，可在后续版本增加编辑标签。上传仅在当前会话内显示。</p>`;
  }
  function chatPage(){if(section==='使用说明')return header('使用说明','AI 对话界面的演示说明')+feature('ABOUT THIS DEMO','先预览界面，再接入服务','当前版本提供对话布局与输入体验；尚未连接 AI 服务，不会生成真实回答。','✦')+`<p class="notice">接入真实 AI 前，请先确定服务提供方、接口配置和家庭数据的隐私策略。不要在此演示页输入敏感信息。</p>`;return header('与家屿 AI 聊聊','一个想法、一件小事，都可以成为对话的开始。',btn('＋ 新对话','new-chat'))+`<div class="chat-shell">${chatHistory.length?`<div class="messages" id="messages">${chatHistory.map(m=>`<div class="bubble ${m.role}">${esc(m.text)}</div>`).join('')}</div>`:`<div class="chat-welcome"><div class="chat-orb">✦</div><h3>今天，有什么新想法？</h3><p>学习灵感、家庭计划、生活问题，从一次对话开始</p><div class="prompts">${['帮我规划一次周末家庭活动','推荐适合孩子的阅读主题','想一个家庭相册的分类方法','给我一些亲子科学实验灵感'].map(x=>`<button data-prompt="${x}">✦ &nbsp;${x}</button>`).join('')}</div></div>`}<div class="composer"><textarea id="chat-input" placeholder="输入想聊的内容…（当前为界面演示）" aria-label="对话输入框"></textarea><div class="compose-bottom"><span>演示模式 · 未连接 AI 服务</span><button data-action="send-chat">发送 ↑</button></div></div></div>`;}
  function resourcesPage(){return header('学习资源共享','好的学习资料，值得和家人一起分享。',btn('了解上传功能','resource-info',true))+feature('LEARN TOGETHER','让每一次探索，都有陪伴','按学科发现学习资源，和家人一起积累成长的灵感。','📚')+`<div class="toolbar"><span class="tag">按学科筛选</span>${['全部','语文','数学','英语','科学','艺术'].map(x=>`<button class="pill" data-filter="${x}" style="${filter===x?'border-color:var(--accent);color:var(--accent)':''}">${x}</button>`).join('')}</div>`+`<div class="resource-grid">${resources.filter(r=>filter==='全部'||r.type===filter).map(r=>`<article class="resource-card"><span class="resource-icon">${r.icon}</span><h4>${r.name}</h4><p>${r.desc}</p><span class="meta">${r.grade} · ${r.type} &nbsp;|&nbsp; 分享人：${r.owner}</span></article>`).join('')}</div><p class="notice">资源卡片为示意内容；文件上传与下载将在后续接入。</p>`;}
  function gradesPage(){return header('成绩记录','看见每一步的进步，不只关注分数。',btn('＋ 添加记录','add-grade',true))+feature('GROW AT YOUR OWN PACE','成长，值得认真记录','记下每一次练习、每一点进步，陪孩子慢慢变好。','✎')+title('学习记录','仅当前浏览器会话可见')+`<div class="record-list"><div class="record-row header"><span>日期</span><span>科目</span><span>成绩 / 等级</span><span>学期</span><span>备注</span></div>${grades.map(g=>`<div class="record-row"><span>${esc(g.date)}</span><span>${esc(g.subject)}</span><span><strong>${esc(g.grade)}</strong></span><span>${esc(g.term)}</span><span>${esc(g.note)}</span></div>`).join('')}</div><p class="notice">演示数据仅在当前页面有效，刷新后会重置；真实使用时需考虑成绩信息的访问权限与安全存储。</p>`;}
  function hobbiesPage(){return header('兴趣爱好分享','不为比较，只为珍藏每一个闪闪发光的热爱。',btn('分享功能说明','hobby-info',true))+feature('CREATE & SHARE','每一种热爱，都值得被看见','记录画笔下的想象、书页里的奇遇、奔跑时的快乐。','✿')+title('兴趣动态','一家人的小小分享')+`<div class="hobby-grid">${hobbies.map(h=>`<article class="hobby-card"><img src="${safeSrc(h.src)}" alt="${esc(h.name)}的示意图片" loading="lazy"><div class="body"><h4>${h.name}</h4><p>${h.desc}</p><div class="meta">✦ ${h.who} · 仅家庭成员可见（设计预览）</div></div></article>`).join('')}</div><p class="notice">展示内容为示例；真实分享及家庭成员权限需要后续接入。</p>`;}
  function renderPlayer(){if(current!=='music'){$('player-slot').innerHTML='';return}const s=songs[activeSong]||{name:'还没有播放',artist:'添加本地音乐来试听'};$('player-slot').innerHTML=`<div class="player"><button data-action="previous" aria-label="上一首">⏮</button><button class="play" data-action="toggle-play" aria-label="播放或暂停">${$('audio').paused?'▶':'Ⅱ'}</button><button data-action="next" aria-label="下一首">⏭</button><span class="track">${esc(s.name)}<small>${esc(s.artist)}</small></span><input id="progress" type="range" min="0" max="100" value="${$('audio').duration?Math.round($('audio').currentTime/$('audio').duration*100):0}" aria-label="播放进度"><span class="time" id="player-time">${formatTime($('audio').currentTime)}</span></div>`;}
  function formatTime(t){return Number.isFinite(t)?`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`:'0:00'}
  function render(){renderNav();renderSide();$('main').innerHTML=current==='movies'?moviePage():current==='music'?musicPage():current==='gallery'?galleryPage():current==='chat'?chatPage():section==='成绩记录'?gradesPage():section==='兴趣爱好分享'?hobbiesPage():resourcesPage();renderPlayer();}
  function switchModule(key,sub){current=key;section=sub||modules[key].items[0][0];filter='全部';query='';photoFilter=key==='gallery'?section:photoFilter;render();window.scrollTo({top:0,behavior:'smooth'});}
  function modal(content){$('modal-slot').innerHTML=`<div class="modal-back"><div class="modal" role="dialog" aria-modal="true" aria-label="详情"><button class="close" data-action="close" aria-label="关闭">✕</button>${content}</div></div>`;$('modal-slot').querySelector('.close').focus();}
  function sendChat(){const input=$('chat-input');if(!input||!input.value.trim())return;chatHistory.push({role:'user',text:input.value.trim()},{role:'ai',text:'当前是 UI 演示页面，尚未接入 AI 服务，因此无法生成真实回答。后续接入服务后，就可以在这里继续对话。'});render();$('chat-input').focus();}
  function playSong(i){if(!audioUrls[i]){modal(`<h3>演示曲目</h3><p>“${esc(songs[i].name)}”仅用于展示界面，没有对应音频。点击「添加本地音乐」，选择你自己的音频文件后即可试听。</p>`);return}activeSong=i;$('audio').src=audioUrls[i];$('audio').play().catch(()=>{});renderPlayer();}
  document.addEventListener('click',e=>{
    const node=e.target.closest('[data-theme-choice],[data-photo-layout],[data-module],[data-section],[data-action],[data-filter],[data-movie-filter],[data-collection],[data-favorite],[data-watched],[data-movie],[data-photo],[data-song],[data-album],[data-prompt]');
    if(!node){if(e.target.classList.contains('modal-back'))$('modal-slot').innerHTML='';return}
    if(node.dataset.themeChoice){setTheme(node.dataset.themeChoice);return}
    if(node.dataset.photoLayout){photoLayout=node.dataset.photoLayout;render();return}
    if(node.dataset.module){const key=node.dataset.module;switchModule(key);if(key==='education'&&matchMedia('(hover: none)').matches){const parent=$('nav').querySelector('[data-module="education"]').closest('.nav-item');parent.classList.add('open');parent.querySelector('.nav-card').setAttribute('aria-expanded','true')}return}
    if(node.dataset.section){const s=node.dataset.section;if(node.closest('.dropdown')||current==='education')switchModule('education',s);else{section=s;if(current==='gallery')photoFilter=s;if(current==='movies')movieFilters={};render()}return}
    if(node.dataset.collection){collectionType=node.dataset.collection;movieFilters={};render();return}
    if(node.dataset.movieFilter){movieFilters[node.dataset.movieFilter]=node.dataset.value;render();return}
    if(node.dataset.favorite!==undefined||node.dataset.watched!==undefined){const favorite=node.dataset.favorite!==undefined;const m=movies[Number(favorite?node.dataset.favorite:node.dataset.watched)];movieState[m.name]??={};movieState[m.name][favorite?'favorite':'watched']=!movieState[m.name][favorite?'favorite':'watched'];saveMovies();render();return}
    if(node.dataset.filter){filter=node.dataset.filter;render();return}
    if(node.dataset.movie!==undefined){const m=movies[Number(node.dataset.movie)];modal(`<h3>${esc(m.name)}</h3><p>${esc(m.year)} · ${esc(m.genre)} · 评分 ${esc(m.score)}</p><p>${esc(m.desc)}</p><p>这是影视内容的界面预览，暂未接入影片文件或播放服务。</p>`);return}
    if(node.dataset.photo!==undefined){const p=photos[Number(node.dataset.photo)];modal(`<h3>${esc(p.name)}</h3><img src="${safeSrc(p.src)}" alt="${esc(p.name)}"><p>相册预览 · ${p.local?'本地上传':'示意图片'}</p>`);return}
    if(node.dataset.song!==undefined){playSong(Number(node.dataset.song));return}
    if(node.dataset.album!==undefined){const i=Number(node.dataset.album);if(i===3){$('music-upload').click();return}section=['音乐首页','收藏歌曲','最近播放'][i];render();return}
    if(node.dataset.prompt){$('chat-input').value=node.dataset.prompt;$('chat-input').focus();return}
    const a=node.dataset.action;if(!a)return;
    if(a==='toggle-filter'){filterOpen=!filterOpen;render()}
    if(a==='close')$('modal-slot').innerHTML='';
    if(a==='photo-upload'||a==='music-upload')$(a).click();
    if(a==='send-chat')sendChat();
    if(a==='new-chat'){chatHistory=[];section='新对话';render()}
    if(a==='resource-info'||a==='hobby-info')modal(`<h3>功能说明</h3><p>这里是 UI 演示版。${a==='resource-info'?'学习资源上传、下载与分类管理':'图文发布、家庭评论与分享'}需要后续接入数据存储和家庭成员权限。</p>`);
    if(a==='add-grade')modal(`<h3>添加成绩记录</h3><form id="grade-form"><label>日期<input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></label><label>科目<input name="subject" maxlength="20" required placeholder="例如：语文"></label><label>成绩或等级<input name="grade" maxlength="20" required placeholder="例如：92 / 优"></label><label>备注<input name="note" maxlength="60" placeholder="例如：单元练习"></label><div class="actions"><button type="button" class="pill" data-action="close">取消</button><button type="submit" class="action primary">保存记录</button></div></form>`);
    const audio=$('audio');if(a==='toggle-play'){if(!audioUrls[activeSong]){modal('<h3>还没有可播放的音频</h3><p>请先添加本地音乐。演示歌曲不包含音频文件。</p>');return}if(audio.paused)audio.play().catch(()=>{});else audio.pause();renderPlayer()}
    if(a==='previous'||a==='next'){const valid=audioUrls.map((u,i)=>u?i:-1).filter(i=>i>=0);if(!valid.length){modal('<h3>播放列表为空</h3><p>请先添加本地音乐。</p>');return}const pos=valid.indexOf(activeSong);playSong(valid[(pos+(a==='next'?1:-1)+valid.length)%valid.length]??valid[0])}
  });
  document.addEventListener('submit',e=>{if(e.target.id!=='grade-form')return;e.preventDefault();const d=new FormData(e.target);grades.unshift({date:String(d.get('date')),subject:String(d.get('subject')).trim(),grade:String(d.get('grade')).trim(),term:'2026 秋季',note:String(d.get('note')).trim()||'—'});$('modal-slot').innerHTML='';render()});
  document.addEventListener('input',e=>{if(e.target.id==='photo-search'||e.target.id==='movie-search'){const cursor=e.target.selectionStart;query=e.target.value;const id=e.target.id;$('main').innerHTML=id==='movie-search'?moviePage():galleryPage();const el=$(id);el.focus();el.setSelectionRange(cursor,cursor)}if(e.target.id==='progress'&&$('audio').duration)$('audio').currentTime=$('audio').duration*Number(e.target.value)/100});
  document.addEventListener('change',e=>{if(e.target.id==='movie-sort'){movieSort=e.target.value;render()}if(e.target.id==='photo-type'){photoType=e.target.value;render()}if(e.target.id==='photo-time'){photoTime=e.target.value;render()}if(e.target.id==='photo-upload'){for(const file of e.target.files){if(!file.type.startsWith('image/'))continue;photos.unshift({name:file.name,src:URL.createObjectURL(file),local:true,type:'人物',date:new Date().toISOString().slice(0,10)})}e.target.value='';photoFilter='照片图库';section='照片图库';photoType='全部';photoTime='全部';query='';render()}if(e.target.id==='music-upload'){for(const file of e.target.files){if(!file.type.startsWith('audio/'))continue;const index=songs.length;songs.push({name:file.name.replace(/\.[^.]+$/,''),artist:'本地音乐',duration:'--:--'});audioUrls[index]=URL.createObjectURL(file)}e.target.value='';render()}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal-slot').innerHTML='';if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-movie],[data-album]')){e.preventDefault();e.target.click()}if(e.key==='Enter'&&e.target.id==='chat-input'&&!e.shiftKey){e.preventDefault();sendChat()}});
  $('audio').addEventListener('timeupdate',()=>{const bar=$('progress');if(bar&&$('audio').duration)bar.value=Math.round($('audio').currentTime/$('audio').duration*100);const clock=$('player-time');if(clock)clock.textContent=formatTime($('audio').currentTime)});
  $('audio').addEventListener('ended',()=>{const next=audioUrls.findIndex((url,i)=>i>activeSong&&url);if(next>=0)playSong(next);else renderPlayer()});$('audio').addEventListener('play',renderPlayer);$('audio').addEventListener('pause',renderPlayer);
  let initialTheme='dark';try{initialTheme=localStorage.getItem('family-theme')||'dark'}catch{}setTheme(initialTheme);
  render();
})();
</script>
</body>
</html>
